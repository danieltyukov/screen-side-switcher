<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#1c62a8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe9f4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- external screen, left -->
  <rect x="18" y="40" width="40" height="30" rx="4" fill="url(#glass)"/>
  <rect x="33" y="70" width="10" height="6" fill="#cfdced"/>
  <rect x="26" y="76" width="24" height="4" rx="2" fill="#cfdced"/>

  <!-- laptop screen, right, drawn taller to read as the built-in panel -->
  <rect x="70" y="34" width="40" height="36" rx="4" fill="url(#glass)"/>
  <path d="M66 76 L114 76 L110 70 L70 70 Z" fill="#cfdced"/>

  <!-- pointer crossing between them -->
  <g stroke="#ffd45e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M55 55 L73 55"/>
  </g>
  <path d="M76 55 L66 50 L66 60 Z" fill="#ffd45e"/>
  <path d="M52 55 L62 50 L62 60 Z" fill="#ffd45e" transform="rotate(180 57 55)"/>
</svg>
