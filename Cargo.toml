[workspace]
members = ["crates/core", "crates/cli"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/danieltyukov/screen-side-switcher"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
